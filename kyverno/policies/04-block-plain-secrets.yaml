# 4/5 — app-level secret hygiene: environment / args must not contain secrets
# patterns as plaintext. This is a *defense-in-depth* the image has no secrets.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-plain-secrets
spec:
  validationFailureAction: Enforce
  rules:
    - name: block-secret-env-in-templates
      match:
        any:
          - resources:
              kinds: ["Deployment", "StatefulSet", "DaemonSet"]
      validate:
        message: "env values must not be plaintext secrets; use Secret + valueFrom"
        deny:
          conditions:
            any:
              - key: >-
                  request.object.spec.template.spec.containers[].env[].value
                operator: AnyIn
                value: [S3cr3t_DB_Pass_123, AKIAOSFODNN7EXAMPLE]