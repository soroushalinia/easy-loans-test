# verify | the captured-image claims are re-checked outside the build
name: "verify | cosign + kyverno + score"

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE: ghcr.io/soroushalinia/easy-loans-test/easyloans
  DIGEST: sha256:8503662edda7b552b6ab98541adbf75fa47bbb2eb8d6655431b1e23c509bc1f7

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3

      - name: cosign verify (keyless)
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.IMAGE }}@${{ env.DIGEST }}

      - name: install kyverno + trivy + gitleaks
        run: |
          curl -sL -o kyverno.tgz "https://github.com/kyverno/kyverno/releases/download/v1.18.2/kyverno-cli_v1.18.2_linux_x86_64.tar.gz" \
            && tar -xzf kyverno.tgz \
            && sudo install -m 755 "$(find . -maxdepth 2 -type f -name kyverno | head -1)" /usr/local/bin/kyverno
          curl -sL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_Linux-64bit.tar.gz" \
            && tar -xzf trivy.tgz trivy \
            && sudo install -m 755 trivy /usr/local/bin/
          curl -sL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            && tar -xzf gitleaks.tgz gitleaks \
            && sudo install -m 755 gitleaks /usr/local/bin/
          kyverno version && trivy --version | head -1 && gitleaks version

      - name: kyverno apply — bad deployment must be REJECTED
        id: bad
        continue-on-error: true
        run: kyverno apply kyverno/policies/ -r platform/bad-deployment.yaml

      - name: kyverno apply — good deployment must PASS
        id: good
        run: kyverno apply kyverno/policies/ -r platform/good-deployment.yaml

      - name: gate check
        run: |
          bad_failed=${{ steps.bad.outcome == 'failure' && 'yes' || 'no' }}
          good_passed=${{ steps.good.outcome == 'success' && 'yes' || 'no' }}
          echo "bad rejected: $bad_failed | good admitted: $good_passed"
          [ "$bad_failed" = "yes" ] && [ "$good_passed" = "yes" ]

      - name: security score
        run: ./score/score.sh ${{ env.IMAGE }}@${{ env.DIGEST }}